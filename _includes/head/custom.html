<!-- Custom typography, layout, and link-color overrides -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Finer, more refined typography =====
     (no !important on font-family, so Font Awesome / academicons icons stay intact;
      these rules load after the theme stylesheet and win by source order) */
  body,
  .page__content,
  .sidebar,
  .masthead,
  .greedy-nav,
  .author__name,
  .author__bio,
  .archive__item-title,
  h1, h2, h3, h4, h5, h6 {
    font-family: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-weight: 400;
    letter-spacing: 0.1px;
    color: #2b2f33;
  }
  .page__content { font-size: 1em; line-height: 1.65; }
  .page__content p,
  .page__content li { font-weight: 400; }
  h1, h2, h3, h4, h5, h6 { font-weight: 600; letter-spacing: -0.2px; }
  /* tone down the heavy default bold so text looks finer */
  .page__content strong,
  .page__content b { font-weight: 600; }

  /* ===== Wider content, smaller left/right margins ===== */
  #main { max-width: 1400px !important; }

  /* ===== Larger author avatar ===== */
  @media (min-width: 48em) {
    .sidebar .author__avatar { display: block; width: auto; }
    .sidebar .author__avatar img {
      max-width: 230px;
      padding: 5px;
      border: 1px solid #e1e4e8;
      border-radius: 50%;
    }
    .sidebar .author__content {
      display: block;
      width: 100%;
      padding-left: 0;
      padding-right: 0;
    }
    .sidebar .author__name { margin-top: 12px; }
  }

  /* ===== Link color scheme (logic-based, scoped to page content) =====
     Blue    -> general & institution / profile links
     Crimson -> papers, PDFs & related documents (the work itself)
     Purple  -> code repositories (GitHub)
     Teal    -> project / demo pages (github.io)
     Red     -> videos (YouTube)
  */
  .page__content a { color: #2a6fb0; }
  .page__content a:hover { color: #16456f; }

  .page__content a[href*="arxiv"],
  .page__content a[href*="openreview"],
  .page__content a[href*="openaccess"],
  .page__content a[href*="ieeexplore"],
  .page__content a[href*="ecva.net"],
  .page__content a[href*="drive.google"],
  .page__content a[href$=".pdf"] { color: #b01b2e; }
  .page__content a[href*="arxiv"]:hover,
  .page__content a[href*="openreview"]:hover,
  .page__content a[href*="openaccess"]:hover,
  .page__content a[href*="ieeexplore"]:hover,
  .page__content a[href*="ecva.net"]:hover,
  .page__content a[href*="drive.google"]:hover,
  .page__content a[href$=".pdf"]:hover { color: #7d1320; }

  .page__content a[href*="github.com"] { color: #6f42c1; }
  .page__content a[href*="github.com"]:hover { color: #4c2d86; }

  .page__content a[href*="github.io"] { color: #138d75; }
  .page__content a[href*="github.io"]:hover { color: #0e6253; }

  .page__content a[href*="youtu"] { color: #c4302b; }
  .page__content a[href*="youtu"]:hover { color: #8f211e; }
</style>
